# Build the site and deploy it to Cloudflare Pages (Direct Upload).
#
# - push to master            -> production deployment
# - pull request / other push -> preview deployment on <branch>.<project>.pages.dev
#
# One-time setup (repository settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN          API token with "Cloudflare Pages: Edit"
#   secret   CLOUDFLARE_ACCOUNT_ID         Cloudflare account id
#   variable CLOUDFLARE_PAGES_PROJECT      Pages project name
# The Decap CMS login (functions/api) also needs GITHUB_CLIENT_ID and
# GITHUB_CLIENT_SECRET set as environment variables on the Pages project itself.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run from the repo root so wrangler also bundles ./functions
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
