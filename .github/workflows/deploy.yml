# Build the site and deploy it to Cloudflare Workers (static assets + the Decap CMS OAuth handlers).
#
# - push to master            -> production deployment (https://pragmasoft.dev)
# - pull request              -> new Worker version uploaded, not promoted (preview URL in the job log)
#
# One-time setup (repository settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN    API token with "Workers Scripts: Edit" (plus the zone permissions
#                                    needed for the custom domain route in wrangler.jsonc)
#   variable CLOUDFLARE_ACCOUNT_ID   Cloudflare account id (not sensitive)
#   secret   OAUTH_CLIENT_SECRET     GitHub OAuth app client secret for the Decap CMS login. Uploaded to the
#                                    Worker as GITHUB_CLIENT_SECRET on every push to master (Actions does not
#                                    allow secret names starting with GITHUB_). To rotate it, update this
#                                    secret and re-run the workflow.
# GITHUB_CLIENT_ID is a plain var in wrangler.jsonc.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Production on master, otherwise upload a version without making it live
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}
          # Secrets apply to the live Worker immediately, so never sync them from pull requests
          secrets: ${{ github.event_name != 'pull_request' && 'GITHUB_CLIENT_SECRET' || '' }}
